name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete Python test suite
        run: python -m unittest discover -s tests -v

  browser-regressions:
    name: Chromium safety regression / Ubuntu / Python 3.13
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install browser automation
        run: python -m pip install -r requirements.txt playwright
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run browser safety regressions
        run: python tests/browser_keyboard_probe.py
      - name: Run real Flask/Chromium disposable-file flow
        run: python tests/browser_live_smoke.py
